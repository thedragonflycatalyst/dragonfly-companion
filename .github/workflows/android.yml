name: Android app

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DRAGONFLY_KEYSTORE_PASSWORD: ${{ secrets.DRAGONFLY_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Signing password is set
        run: |
          if [ -z "$DRAGONFLY_KEYSTORE_PASSWORD" ] || [ ${#DRAGONFLY_KEYSTORE_PASSWORD} -lt 12 ]; then
            echo "::error::Add the repository secret DRAGONFLY_KEYSTORE_PASSWORD (12+ characters) under Settings → Secrets and variables → Actions."
            exit 1
          fi

      # The signing key is made once, here, from the owner's secret password and
      # kept in the repository only in encrypted form. The password never leaves
      # GitHub's secret store. Keep the same password forever: phones accept an
      # update only when it is signed with the same key.
      - name: Create the signing key (first run only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f android/release.keystore.enc ]; then
            # Never replace a key once an app was published: installed apps would refuse every update.
            if [ -n "$(gh release list --limit 200 --json tagName --jq '.[].tagName | select(startswith("android-v"))')" ]; then
              echo "::error::android/release.keystore.enc is missing but Android releases exist. Restore the file from Git history; do not create a new key."
              exit 1
            fi
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/release.keystore" -storetype PKCS12 \
              -alias dragonfly -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass:env DRAGONFLY_KEYSTORE_PASSWORD -keypass:env DRAGONFLY_KEYSTORE_PASSWORD \
              -dname "CN=Dragonfly Companion, O=Dragonfly Uploader"
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:DRAGONFLY_KEYSTORE_PASSWORD \
              -in "$RUNNER_TEMP/release.keystore" -out android/release.keystore.enc
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass:env DRAGONFLY_KEYSTORE_PASSWORD -alias dragonfly -v \
              | sed -n 's/^.*SHA256: *//p' | head -1 > android/signing-cert.sha256
            git add android/release.keystore.enc android/signing-cert.sha256
            git commit -m "Android: add the encrypted app signing key [skip ci]"
            git push
          fi

      - name: Unlock the signing key
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:DRAGONFLY_KEYSTORE_PASSWORD \
            -in android/release.keystore.enc -out "$RUNNER_TEMP/release.keystore"
          ACTUAL=$(keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass:env DRAGONFLY_KEYSTORE_PASSWORD -alias dragonfly -v | sed -n 's/^.*SHA256: *//p' | head -1)
          if [ "$ACTUAL" != "$(cat android/signing-cert.sha256)" ]; then
            echo "::error::The signing key does not match android/signing-cert.sha256."
            exit 1
          fi
          echo "DRAGONFLY_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the app
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/release/app-release.apk "Dragonfly-${VERSION}.apk"
          SHA=$(sha256sum "Dragonfly-${VERSION}.apk" | cut -d' ' -f1)
          if gh release view "android-v${VERSION}" >/dev/null 2>&1; then
            gh release upload "android-v${VERSION}" "Dragonfly-${VERSION}.apk" --clobber
            exit 0
          fi
          gh release create "android-v${VERSION}" "Dragonfly-${VERSION}.apk" \
            --title "Dragonfly for Android ${VERSION}" \
            --notes "Download **Dragonfly-${VERSION}.apk** on your Android phone and open it to install or update.

          The first time, Android asks you to allow installs from your browser; allow it once.

          SHA-256: \`${SHA}\`" \
            --latest

      - name: Remove the unlocked key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
