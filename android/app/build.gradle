plugins {
    id 'com.android.application'
}

// Release builds are numbered by the CI run; local builds stay at 1.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
def keystorePath = System.getenv('DRAGONFLY_KEYSTORE')

android {
    namespace 'app.dragonfly.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'app.dragonfly.companion'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('DRAGONFLY_KEYSTORE_PASSWORD')
                keyAlias 'dragonfly'
                keyPassword System.getenv('DRAGONFLY_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
